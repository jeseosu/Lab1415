<header class="container">
    <a href="{{ url_for('index') }}" class="logo">Wolk-Talk</a>
    <nav>
        <ul>
            <li {% if request.endpoint == 'index' %}class="active"{% endif %}><a href="{{ url_for('index') }}">Головна</a></li>
            <li {% if request.endpoint in ('boards', 'board_view', 'new_topic', 'topic_view') %}class="active"{% endif %}><a href="{{ url_for('boards') }}">Дошка</a></li>
            <li {% if request.endpoint == 'statistic' %}class="active"{% endif %}><a href="{{ url_for('statistic') }}">Статистика</a></li>
            {% if g.user %}
                <li class="user-name">{{ g.user.username }}</li>
                <li class="btn">
                    <form method="post" action="{{ url_for('logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="nav-btn">Вихід</button>
                    </form>
                </li>
            {% else %}
                <li class="btn"><a href="{{ url_for('login') }}">Вхід</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
<div class="container flashes">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
</div>
